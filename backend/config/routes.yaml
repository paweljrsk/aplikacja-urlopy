external_controllers:
    resource:
        path: ../src/Controller/External
        namespace: App\Controller\External
    type: attribute
    prefix: /api/v1

internal_controllers:
    resource:
        path: ../src/Controller/Internal
        namespace: App\Controller\Internal
    type: attribute
    prefix: /api

auth_controllers:
    resource:
        path: ../src/Controller/Auth
        namespace: App\Controller\Auth
    type: attribute

access_controllers:
    resource:
        path: ../src/Controller/Access
        namespace: App\Controller\Access
    type: attribute

password_controller:
    resource: ../src/Controller/PasswordController.php
    type: attribute

admin_controllers:
    resource: ../src/Controller/Admin/
    type: attribute

balance_controllers:
    resource: ../src/Controller/Balance/
    type: attribute

request_controllers:
    resource: ../src/Controller/Requests/
    type: attribute
