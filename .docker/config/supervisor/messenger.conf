[program:messenger]
command=php /var/www/html/backend/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --no-interaction
numprocs=1
startsecs=5
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
