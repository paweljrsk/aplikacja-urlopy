services:
  nginx:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: server
      args:
        APP_ENV: '${APP_ENV:-dev}'
    ports:
      - '${DEPLOY_PORT:-8080}:80'
    volumes:
      - ./.docker/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
    environment:
      TZ: 'Europe/Warsaw'

  node-npm:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: frontend-build
      args:
        APP_ENV: '${APP_ENV:-dev}'
    volumes:
      - ./frontend:/var/www/html/frontend
    command: npm i

  node:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: frontend
      args:
        APP_ENV: '${APP_ENV:-dev}'
    volumes:
      - ./frontend:/var/www/html/frontend
    command: npm run dev
    depends_on:
      node-npm:
        condition: service_completed_successfully

  php-composer:
    build:
      dockerfile: .docker/Dockerfile
      context: .
      target: backend-build
      args:
        APP_ENV: '${APP_ENV:-dev}'
    user: 1000:1000
    volumes:
      - ./backend:/var/www/html/backend
    command: composer install --no-cache

  php:
    build:
      dockerfile: .docker/Dockerfile
      context: .
      target: backend
      args:
        APP_ENV: '${APP_ENV:-dev}'
    volumes:
      - ./backend:/var/www/html/backend
    environment:
      PHP_IDE_CONFIG: "serverName=localhost"
      XDEBUG_CLIENT: $XDEBUG_CLIENT
    depends_on:
      php-composer:
        condition: service_completed_successfully

  supervisor:
    build:
      dockerfile: .docker/Dockerfile
      context: .
      target: supervisor
      args:
        APP_ENV: '${APP_ENV:-dev}'
    volumes:
      - ./.docker/config/supervisor:/etc/supervisor/conf.d
      - ./backend:/var/www/html/backend
    depends_on:
      php:
        condition: service_started

  redis:
    build:
      dockerfile: .docker/Dockerfile
      context: .
      target: redis
    environment:
      REDIS_PORT: 6378
      REDIS_PASSWORD: pass1234

  rabbit:
    image: rabbitmq:4.0
    volumes:
      - rabbit:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: notus
      RABBITMQ_DEFAULT_PASS: pass1234

  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_DATABASE: calendar
      MYSQL_USER: notus
      MYSQL_PASSWORD: pass1234
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql:/var/lib/mysql

volumes:
  rabbit:
  mysql:
