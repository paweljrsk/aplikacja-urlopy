name: Baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize development stack
        run: make init
      - name: Verify HTTP and database
        run: make verify
      - name: Repeat migration and validate schema
        run: |
          make db-migrate
          make db-validate
      - name: Load synthetic fixture twice without duplication
        run: |
          make demo
          make demo
      - name: Backend tests
        run: |
          # Exercise upgrading a populated stage 2 schema before the test suite.
          docker compose exec -T mysql sh -s < .docker/scripts/prepare-test-database.sh
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:database:create --if-not-exists --no-interaction
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:migrations:migrate 'DoctrineMigrations\Version20261106210000' --no-interaction
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:query:sql "INSERT INTO app_user (first_name,last_name,email,active,is_administrator,must_change_password,version,assignment_revision) VALUES ('Synthetic','Upgrade','stage3-upgrade@example.test',1,0,1,1,0)"
          make test
          docker compose exec -T -e APP_ENV=test php php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          (new Symfony\Component\Dotenv\Dotenv())->bootEnv('.env');
          $kernel = new App\Kernel('test', true);
          $kernel->boot();
          $row = $kernel->getContainer()->get('doctrine')->getConnection()->fetchAssociative(
              'SELECT first_name,last_name,password_hash,credential_version,temporary_password_expires_at FROM app_user WHERE email = ?',
              ['stage3-upgrade@example.test'],
          );
          if (!$row || $row['first_name'] !== 'Synthetic' || $row['last_name'] !== 'Upgrade'
              || $row['password_hash'] !== null || (int) $row['credential_version'] !== 1
              || $row['temporary_password_expires_at'] !== null) {
              throw new RuntimeException('Stage 2 account was not preserved by the credential migration.');
          }
          echo "Stage 2 account preserved, with safe credential defaults.\n";
          PHP
      - name: Static checks
        run: make lint
      - name: Production frontend build
        run: docker compose exec -T node npm run build
      - name: Browser auth screens with synthetic API responses
        run: |
          npm install --prefix /tmp/urlopy-ui --no-package-lock --ignore-scripts playwright-core@1.62.1
          NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/auth-ui-check.cjs
      - name: Write synthetic persistence marker outside the application schema
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root' <<'SQL'
          CREATE DATABASE urlopy_ci_persistence;
          CREATE TABLE urlopy_ci_persistence.probe (id INT PRIMARY KEY, marker VARCHAR(40) NOT NULL);
          INSERT INTO urlopy_ci_persistence.probe VALUES (1, 'stage1-stop-start');
          SQL
      - name: Restart without deleting data
        run: |
          make stop
          make start
          make verify
          make demo
          marker="$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root --batch --skip-column-names -e "SELECT marker FROM urlopy_ci_persistence.probe WHERE id = 1"')"
          test "$marker" = 'stage1-stop-start'
      - name: Verify optional Messenger and Scheduler workers
        run: |
          make workers
          docker compose exec -T supervisor python3 - <<'PY'
          import pathlib
          import time

          def workers():
              found = {}
              for entry in pathlib.Path('/proc').glob('[0-9]*/cmdline'):
                  try:
                      args = entry.read_bytes().decode().split('\0')
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if 'messenger:consume' in args:
                      transport = args[args.index('messenger:consume') + 1]
                      if transport in ('async', 'scheduler_default'):
                          found[transport] = entry.parent.name
              return found

          deadline = time.monotonic() + 40
          previous = {}
          stable_since = time.monotonic()
          while time.monotonic() < deadline:
              current = workers()
              if current != previous or len(current) != 2:
                  previous, stable_since = current, time.monotonic()
              elif time.monotonic() - stable_since >= 12:
                  print('Both worker processes remain running without a restart:', sorted(current))
                  break
              time.sleep(1)
          else:
              raise SystemExit('Workers failed to become stable: ' + repr(previous))
          PY
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --profile workers ps --all
          docker compose --profile workers logs --no-color --tail=150
      - name: Remove synthetic persistence marker
        if: always()
        run: |
          if docker compose ps --status running --services | grep -qx mysql; then
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "DROP DATABASE IF EXISTS urlopy_ci_persistence"'
          fi
      - name: Stop containers and preserve volumes
        if: always()
        run: docker compose --profile workers down
