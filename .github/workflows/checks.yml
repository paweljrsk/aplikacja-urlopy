name: Baseline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan source and tracked history for secret patterns and unsafe sinks
        run: python3 .github/scripts/security-source-check.py --history
      - name: Initialize development stack
        run: make init
      - name: Verify HTTP and database
        run: make verify
      - name: Repeat migration and validate schema
        run: |
          make db-migrate
          make db-validate
      - name: Load synthetic fixture twice without duplication
        run: |
          make demo
          make demo
      - name: Backend tests
        run: |
          # Exercise upgrading a populated stage 2 schema before the test suite.
          docker compose exec -T mysql sh -s < .docker/scripts/prepare-test-database.sh
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:database:create --if-not-exists --no-interaction
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:migrations:migrate 'DoctrineMigrations\Version20261106210000' --no-interaction
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:query:sql "INSERT INTO app_user (first_name,last_name,email,active,is_administrator,must_change_password,version,assignment_revision) VALUES ('Synthetic','Upgrade','stage3-upgrade@example.test',1,0,1,1,0)"
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:migrations:migrate 'DoctrineMigrations\Version20261106233000' --no-interaction
          docker compose exec -T -e APP_ENV=test php php tests/Support/admin-upgrade-check.php seed
          docker compose exec -T -e APP_ENV=test php php bin/console doctrine:migrations:migrate 'DoctrineMigrations\Version20261107090000' --no-interaction
          docker compose exec -T -e APP_ENV=test php php tests/Support/accounting-upgrade-check.php seed
          make test-prepare
          docker compose exec -T -e APP_ENV=test php php tests/Support/admin-upgrade-check.php verify
          docker compose exec -T -e APP_ENV=test php php tests/Support/accounting-upgrade-check.php verify
          docker compose exec -T -e APP_ENV=test php php tests/Support/credentials-cli-check.php
          make test
          docker compose exec -T -e APP_ENV=test php php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          (new Symfony\Component\Dotenv\Dotenv())->bootEnv('.env');
          $kernel = new App\Kernel('test', true);
          $kernel->boot();
          $row = $kernel->getContainer()->get('doctrine')->getConnection()->fetchAssociative(
              'SELECT first_name,last_name,password_hash,credential_version,temporary_password_expires_at FROM app_user WHERE email = ?',
              ['stage3-upgrade@example.test'],
          );
          if (!$row || $row['first_name'] !== 'Synthetic' || $row['last_name'] !== 'Upgrade'
              || $row['password_hash'] !== null || (int) $row['credential_version'] !== 1
              || $row['temporary_password_expires_at'] !== null) {
              throw new RuntimeException('Stage 2 account was not preserved by the credential migration.');
          }
          echo "Stage 2 account preserved, with safe credential defaults.\n";
          PHP
      - name: Static checks
        run: make lint
      - name: Production frontend build
        run: docker compose exec -T node npm run build
      - name: Browser auth screens with synthetic API responses
        id: auth_ui
        continue-on-error: true
        run: |
          npm install --prefix /tmp/urlopy-ui --no-package-lock --ignore-scripts playwright-core@1.62.1
          NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/auth-ui-check.cjs
      - name: Browser administration screens with synthetic API responses
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/admin-ui-check.cjs
      - name: Browser balance and company calendar screens with synthetic API responses
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/balance-ui-check.cjs
      - name: Browser employee requests and calendar with synthetic API responses
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/requests-ui-check.cjs
      - name: Browser calendar filters and scoped details with synthetic API responses
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/calendar-ui-check.cjs
      - name: Browser managed request decisions and corrections with synthetic API responses
        id: managed_ui
        continue-on-error: true
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/managed-requests-ui-check.cjs
      - name: Browser management module and role guides with synthetic API responses
        id: module_tours
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/module-tour-ui-check.cjs
      - name: Write synthetic persistence marker outside the application schema
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root' <<'SQL'
          CREATE DATABASE urlopy_ci_persistence;
          CREATE TABLE urlopy_ci_persistence.probe (id INT PRIMARY KEY, marker VARCHAR(40) NOT NULL);
          INSERT INTO urlopy_ci_persistence.probe VALUES (1, 'stage1-stop-start');
          SQL
      - name: Restart without deleting data
        run: |
          make stop
          make start
          make verify
          make demo
          marker="$(docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root --batch --skip-column-names -e "SELECT marker FROM urlopy_ci_persistence.probe WHERE id = 1"')"
          test "$marker" = 'stage1-stop-start'
      - name: Real HTTP authentication through Nginx and PHP-FPM
        run: BASE_URL=http://localhost:8080 node .github/scripts/auth-http-check.cjs
      - name: Real employee request process through Chrome and Nginx
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/requests-e2e-check.cjs
      - name: Real manager decisions and historical correction through Chrome and Nginx
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/managed-requests-e2e-check.cjs
      - name: Complete system process through Chrome and real API
        id: system_e2e
        continue-on-error: true
        run: NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/system-e2e-check.cjs
      - name: Authenticated negative HTTP security probes
        id: pentest_http
        continue-on-error: true
        run: |
          # Each real security suite has its own limiter budget on synthetic CI data.
          # Do not change the production login limits to accommodate other tests.
          docker compose exec -T php php bin/console cache:pool:clear cache.app
          BASE_URL=http://localhost:8080 node .github/scripts/pentest-http-check.cjs
      - name: Measure representative API and rendered views
        id: performance
        continue-on-error: true
        run: |
          docker compose exec -T php php bin/console cache:pool:clear cache.app
          NODE_PATH=/tmp/urlopy-ui/node_modules BASE_URL=http://localhost:8080 CHROME_PATH="$(command -v google-chrome)" node .github/scripts/performance-check.cjs
      - name: Audit locked dependency advisories
        id: dependency_audit
        continue-on-error: true
        run: |
          mkdir -p /tmp/urlopy-security
          failed=0
          docker compose exec -T php composer audit --locked --format=json > /tmp/urlopy-security/composer.json || failed=1
          docker compose exec -T node npm audit --omit=dev --audit-level=low --json > /tmp/urlopy-security/npm-production.json || failed=1
          docker compose exec -T node npm audit --audit-level=low --json > /tmp/urlopy-security/npm-all.json || failed=1
          exit "$failed"
      - name: Scan running container image vulnerabilities
        id: container_security
        continue-on-error: true
        run: python3 .github/scripts/container-security-check.py
      - name: Passive ZAP baseline on isolated HTTP stack
        id: zap_baseline
        continue-on-error: true
        run: BASE_URL=http://localhost:8080 bash .github/scripts/pentest-zap-check.sh
      - name: Verify optional Messenger and Scheduler workers
        run: |
          make workers
          docker compose exec -T supervisor python3 - <<'PY'
          import pathlib
          import time

          def workers():
              found = {}
              for entry in pathlib.Path('/proc').glob('[0-9]*/cmdline'):
                  try:
                      args = entry.read_bytes().decode().split('\0')
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if 'messenger:consume' in args:
                      transport = args[args.index('messenger:consume') + 1]
                      if transport in ('async', 'scheduler_default'):
                          found[transport] = entry.parent.name
              return found

          deadline = time.monotonic() + 40
          previous = {}
          stable_since = time.monotonic()
          while time.monotonic() < deadline:
              current = workers()
              if current != previous or len(current) != 2:
                  previous, stable_since = current, time.monotonic()
              elif time.monotonic() - stable_since >= 12:
                  print('Both worker processes remain running without a restart:', sorted(current))
                  break
              time.sleep(1)
          else:
              raise SystemExit('Workers failed to become stable: ' + repr(previous))
          PY
      - name: Require managed request browser checks to pass
        if: always() && steps.managed_ui.outcome == 'failure'
        run: |
          echo 'Managed request browser checks failed; independent E2E results do not override this failure.'
          exit 1
      - name: Require system, performance and dependency checks to pass
        if: always() && (steps.system_e2e.outcome == 'failure' || steps.performance.outcome == 'failure' || steps.dependency_audit.outcome == 'failure' || steps.pentest_http.outcome == 'failure' || steps.container_security.outcome == 'failure' || steps.zap_baseline.outcome == 'failure' || steps.auth_ui.outcome == 'failure')
        run: exit 1
      - name: Save performance and dependency reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage11-check-reports
          path: |
            /tmp/urlopy-performance/
            /tmp/urlopy-security/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-ui-screenshots
          path: /tmp/urlopy-ui-screens/
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --profile workers ps --all
          docker compose --profile workers logs --no-color --tail=150
      - name: Remove synthetic persistence marker
        if: always()
        run: |
          if docker compose ps --status running --services | grep -qx mysql; then
            docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "DROP DATABASE IF EXISTS urlopy_ci_persistence"'
          fi
      - name: Stop containers and preserve volumes
        if: always()
        run: docker compose --profile workers down
